name: Deploy to Rinja-Cloud

on:
  push:
    branches: [ "*" ]
# Manual trigger to fix branch sync

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull Latest Changes
        run: |
          cd /var/www/hotpot
          git pull origin ${{ github.ref_name }}

      - name: Install Dependencies (PHP)
        run: |
          cd /var/www/hotpot
          export PATH=$PATH:/usr/local/bin:/usr/bin
          composer install --no-dev --optimize-autoloader || php /usr/local/bin/composer install --no-dev --optimize-autoloader

      - name: Build Assets
        run: |
          cd /var/www/hotpot
          export PATH=$PATH:/usr/local/bin:/usr/bin
          npm install
          npm run build

      - name: Run Migrations
        run: |
          cd /var/www/hotpot
          export PATH=$PATH:/usr/local/bin:/usr/bin
          php artisan migrate --force

      - name: Clear Cache
        run: |
          cd /var/www/hotpot
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
